plugins { id 'com.android.application' }

android {
    namespace 'com.ary.xausinyal'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ary.xausinyal'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }
    signingConfigs {
        tetap {
            // kunci disimpan di GitHub Secret (KEYSTORE_B64 & KEYSTORE_PASS), tidak ada di repository
            storeFile file(System.getenv('KS_FILE') ?: 'release.keystore')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias 'xausinyal'
            keyPassword System.getenv('KS_PASS') ?: ''
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.tetap }
        release { minifyEnabled false; signingConfig signingConfigs.tetap }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
